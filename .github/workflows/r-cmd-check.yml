name: R CMD check

on:
  push:
    paths:
      - "bindings/r/**"
      - "agent-detect-spec/**"
      - ".github/workflows/r-cmd-check.yml"
  pull_request:
    paths:
      - "bindings/r/**"
      - "agent-detect-spec/**"
      - ".github/workflows/r-cmd-check.yml"

permissions:
  contents: read

jobs:
  check-vendor-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Check bindings/r/inst/agent-detect-spec/ is in sync with agent-detect-spec/vendor/
        run: Rscript bindings/r/data-raw/check-vendor-sync.R

  r-cmd-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: |
            any::rcmdcheck

      - name: R CMD check
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r
          error-on: '"warning"'
